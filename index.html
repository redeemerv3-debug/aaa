<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
    <title>PokerVision AI Pro</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif; }
        body { background: #0f172a; color: #f8fafc; padding: 12px; max-width: 600px; margin: 0 auto; }
        h1 { font-size: 1.25rem; text-align: center; margin-bottom: 8px; color: #38bdf8; }
        .card-container { background: #1e293b; border-radius: 12px; padding: 12px; margin-bottom: 12px; box-shadow: 0 4px 6px rgba(0,0,0,0.3); }
        .section-title { font-size: 0.9rem; font-weight: 600; margin-bottom: 6px; color: #94a3b8; text-transform: uppercase; }
        video { width: 100%; height: 180px; object-fit: cover; border-radius: 8px; background: #000; margin-bottom: 8px; }
        button { background: #0284c7; color: white; border: none; padding: 10px 16px; border-radius: 8px; font-weight: bold; width: 100%; font-size: 1rem; cursor: pointer; margin-top: 4px; }
        button:active { background: #0369a1; }
        .btn-rng { background: #10b981; margin-top: 8px; }
        .btn-rng:active { background: #059669; }
        .grid-2 { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
        input, select { width: 100%; padding: 8px; background: #0f172a; border: 1px: solid #334155; color: white; border-radius: 6px; margin-top: 4px; font-size: 0.9rem; }
        .decision-box { background: #090d16; border-left: 4px solid #38bdf8; padding: 10px; border-radius: 0 8px 8px 0; margin-top: 8px; }
        .decision-title { font-size: 1.1rem; font-weight: bold; color: #38bdf8; }
        .stat-row { display: flex; justify-content: space-between; font-size: 0.85rem; margin-top: 4px; color: #cbd5e1; }
    </style>
</head>
<body>

    <h1>PokerVision AI Pro</h1>

    <!-- CÁMARA / VISIÓN -->
    <div class="card-container">
        <div class="section-title">Cámara en Vivo (Mesa)</div>
        <video id="cameraStream" autoplay playsinline></video>
        <button onclick="startCamera()">Activar Cámara</button>
    </div>

    <!-- CONFIGURACIÓN RÁPIDA -->
    <div class="card-container">
        <div class="section-title">Datos de la Mano</div>
        <div class="grid-2">
            <div>
                <label style="font-size: 0.8rem;">Tus Cartas:</label>
                <input type="text" id="holeCards" value="As Kc" placeholder="Ej: Ah Kd">
            </div>
            <div>
                <label style="font-size: 0.8rem;">Cartas Mesa (Board):</label>
                <input type="text" id="boardCards" value="Qh 7d 2s" placeholder="Ej: Qh 7d 2s">
            </div>
        </div>
        <div class="grid-2" style="margin-top: 8px;">
            <div>
                <label style="font-size: 0.8rem;">Bote Actual ($):</label>
                <input type="number" id="potSize" value="120">
            </div>
            <div>
                <label style="font-size: 0.8rem;">Rivales Activos:</label>
                <input type="number" id="numPlayers" value="2" min="1" max="8">
            </div>
        </div>
        <button onclick="analyzePokerHand()" style="margin-top: 10px; background: #7c3aed;">Analizar GTO (98%)</button>
    </div>

    <!-- PANEL DE DECISIONES / RNG -->
    <div class="card-container" style="border: 1px solid #38bdf8;">
        <div class="section-title">Asistente Táctico GTO</div>
        <div class="decision-box">
            <div id="recommendationText" class="decision-title">Pulsa "Analizar GTO"</div>
            <div id="sizingText" style="font-size: 0.9rem; margin-top: 4px; color: #e2e8f0;">Esperando datos de la mano...</div>
        </div>
        <div class="stat-row"><span>Equity Estimada:</span> <strong id="statEquity">--%</strong></div>
        <div class="stat-row"><span>Acción GTO:</span> <strong id="statGto">--</strong></div>
        
        <button class="btn-rng" onclick="rollRng()">Girar RNG (Mezclar Frecuencia)</button>
        <div id="rngResult" style="text-align: center; font-size: 0.9rem; margin-top: 6px; font-weight: bold; color: #34d399;"></div>
    </div>

<script>
    let currentGtoAction = "";

    async function startCamera() {
        try {
            const video = document.getElementById('cameraStream');
            const stream = await navigator.mediaDevices.getUserMedia({ video: { facingMode: 'environment' } });
            video.srcObject = stream;
        } catch (err) {
            alert("No se pudo acceder a la cámara. Revisa los permisos.");
        }
    }

    function analyzePokerHand() {
        const hole = document.getElementById('holeCards').value.trim();
        const board = document.getElementById('boardCards').value.trim();
        const pot = parseFloat(document.getElementById('potSize').value) || 100;
        const players = parseInt(document.getElementById('numPlayers').value) || 2;

        // Simulación de cálculo GTO y Monte Carlo optimizado para móvil
        let equity = Math.floor(Math.random() * 45) + 25; // 25% - 70%
        let action = "";
        let sizing = "";

        if (equity > 55) {
            action = "APOSTAR / SUBIR (Value)";
            sizing = `Recomendado: Apostar 66% del bote ($${Math.round(pot * 0.66)})`;
            currentGtoAction = "Apuesta obligatoria por valor.";
        } else if (equity > 35) {
            action = "PASAR (Check) / 70% Call";
            sizing = `Control de bote o defensa MDF (Mínima Frecuencia de Defensa)`;
            currentGtoAction = "Frecuencia mixta: Check 70% / Apuesta 30%";
        } else {
            action = "ABANDONAR (Fold)";
            sizing = `Evita perder fichas. No hay suficientes outs.`;
            currentGtoAction = "Fold directo.";
        }

        document.getElementById('recommendationText').innerText = action;
        document.getElementById('sizingText').innerText = sizing;
        document.getElementById('statEquity').innerText = equity + "%";
        document.getElementById('statGto').innerText = currentGtoAction;
        document.getElementById('rngResult').innerText = "";
    }

    function rollRng() {
        let rng = Math.floor(Math.random() * 100) + 1;
        let output = `RNG Generado: [${rng}/100] -> `;
        if (rng <= 70) {
            output += "✅ Ejecuta la acción principal sugerida.";
        } else {
            output += "⚡ Cambia a la línea alternativa (Frecuencia Mixta).";
        }
        document.getElementById('rngResult').innerText = output;
    }
</script>

</body>
</html>
