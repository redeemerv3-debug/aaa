<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>PokerVision Pro - Streaming GTO</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
</head>
<body class="bg-slate-950 text-slate-100 min-h-screen">
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect, useRef, useMemo } = React;

        const RANKS = [
            { value: 14, label: 'A' }, { value: 13, label: 'K' }, { value: 12, label: 'Q' }, 
            { value: 11, label: 'J' }, { value: 10, label: '10' }, { value: 9, label: '9' }, 
            { value: 8, label: '8' }, { value: 7, label: '7' }, { value: 6, label: '6' }, 
            { value: 5, label: '5' }, { value: 4, label: '4' }, { value: 3, label: '3' }, { value: 2, label: '2' }
        ];

        const SUITS = [
            { id: 's', symbol: '♠', color: 'text-slate-900 bg-slate-100 border-slate-300' },
            { id: 'h', symbol: '♥', color: 'text-red-600 bg-red-50 border-red-200' },
            { id: 'd', symbol: '♦', color: 'text-blue-600 bg-blue-50 border-blue-200' },
            { id: 'c', symbol: '♣', color: 'text-emerald-700 bg-emerald-50 border-emerald-200' },
        ];

        const createFullDeck = () => {
            const deck = [];
            for (const r of RANKS) {
                for (const s of SUITS) {
                    deck.push({ rank: r.value, suit: s.id, label: r.label, symbol: s.symbol });
                }
            }
            return deck;
        };

        const evaluate7Cards = (cards) => {
            if (!cards || cards.length === 0) return { score: 0 };
            const rankCounts = {};
            const suitCards = { s: [], h: [], d: [], c: [] };
            cards.forEach(c => {
                rankCounts[c.rank] = (rankCounts[c.rank] || 0) + 1;
                if (suitCards[c.suit]) suitCards[c.suit].push(c.rank);
            });
            const uniqueRanks = Object.keys(rankCounts).map(Number).sort((a, b) => b - a);

            const findStraight = (rankList) => {
                const set = new Set(rankList);
                if (set.has(14)) set.add(1);
                const sorted = Array.from(set).sort((a, b) => b - a);
                let consecutive = 1;
                for (let i = 0; i < sorted.length - 1; i++) {
                    if (sorted[i] - sorted[i + 1] === 1) {
                        consecutive++;
                        if (consecutive >= 5) return sorted[i - 3];
                    } else { consecutive = 1; }
                }
                return 0;
            };

            let flushSuit = null;
            for (const s of ['s', 'h', 'd', 'c']) {
                if (suitCards[s].length >= 5) { flushSuit = s; break; }
            }

            if (flushSuit) {
                const sfHigh = findStraight(suitCards[flushSuit].sort((a, b) => b - a));
                if (sfHigh > 0) return { score: 8000000 + sfHigh };
            }

            const quads = [], trips = [], pairs = [];
            for (const r of uniqueRanks) {
                const count = rankCounts[r];
                if (count === 4) quads.push(r);
                else if (count === 3) trips.push(r);
                else if (count === 2) pairs.push(r);
            }

            if (quads.length > 0) return { score: 7000000 + quads[0] * 100 };
            if (trips.length >= 2 || (trips.length === 1 && pairs.length >= 1)) return { score: 6000000 + trips[0] * 100 };
            if (flushSuit) return { score: 5000000 };
            const straightHigh = findStraight(uniqueRanks);
            if (straightHigh > 0) return { score: 4000000 + straightHigh };
            if (trips.length > 0) return { score: 3000000 + trips[0] * 500 };
            if (pairs.length >= 2) return { score: 2000000 + pairs[0] * 500 };
            if (pairs.length === 1) return { score: 1000000 + pairs[0] * 4000 };
            return { score: uniqueRanks[0] || 0 };
        };

        const runMonteCarlo = (hole, board) => {
            const validHole = hole.filter(Boolean);
            const validBoard = board.filter(Boolean);
            if (validHole.length < 2) return 50;
            const known = [...validHole, ...validBoard];
            const deck = createFullDeck().filter(d => !known.some(k => k.rank === d.rank && k.suit === d.suit));

            let wins = 0;
            const iterations = 80;
            const neededBoard = Math.max(0, 5 - validBoard.length);

            for (let i = 0; i < iterations; i++) {
                const dCopy = [...deck];
                for (let j = 0; j < neededBoard + 2; j++) {
                    const r = j + Math.floor(Math.random() * (dCopy.length - j));
                    const temp = dCopy[j]; dCopy[j] = dCopy[r]; dCopy[r] = temp;
                }
                const simBoard = [...validBoard, ...dCopy.slice(0, neededBoard)];
                const vHole = [dCopy[neededBoard], dCopy[neededBoard + 1]];

                const heroScore = evaluate7Cards([...validHole, ...simBoard]).score;
                const villainScore = evaluate7Cards([...vHole, ...simBoard]).score;

                if (heroScore > villainScore) wins++;
                else if (heroScore === villainScore) wins += 0.5;
            }
            return Math.round((wins / iterations) * 100);
        };

        function App() {
            const [apiKeyInput, setApiKeyInput] = useState(localStorage.getItem('poker_gemini_key') || '');
            const [apiKey, setApiKey] = useState(localStorage.getItem('poker_gemini_key') || '');
            const [keySaved, setKeySaved] = useState(!!localStorage.getItem('poker_gemini_key'));
            
            const [holeCards, setHoleCards] = useState([null, null]);
            const [boardCards, setBoardCards] = useState([null, null, null, null, null]);
            const [pot, setPot] = useState(150);
            const [callAmount, setCallAmount] = useState(50);
            const [isStreaming, setIsStreaming] = useState(false);
            const [streamStatus, setStreamStatus] = useState('Inactivo');
            const [debugLog, setDebugLog] = useState('Esperando clave y cámara...');
            const [rng, setRng] = useState(null);

            const videoRef = useRef(null);
            const canvasRef = useRef(null);
            const streamTimerRef = useRef(null);

            const equity = useMemo(() => runMonteCarlo(holeCards, boardCards), [holeCards, boardCards]);

            const handleSaveKey = (e) => {
                e.preventDefault();
                if (!apiKeyInput.trim()) return;
                setApiKey(apiKeyInput.trim());
                localStorage.setItem('poker_gemini_key', apiKeyInput.trim());
                setKeySaved(true);
                setDebugLog('API Key guardada correctamente.');
            };

            const decision = useMemo(() => {
                const validHole = holeCards.filter(Boolean);
                if (validHole.length < 2) return { action: 'INICIA LA CÁMARA', sizing: 'La IA analizará tus cartas de mano y mesa', color: 'slate', potOdds: 0, mdf: 100 };

                const potOdds = callAmount > 0 ? Math.round((callAmount / (pot + callAmount)) * 100) : 0;
                const mdf = callAmount > 0 ? Math.round((pot / (pot + callAmount)) * 100) : 100;

                let action = 'CHECK / PASAR';
                let sizing = '0 fichas';
                let color = 'amber';

                if (callAmount === 0) {
                    if (equity >= 58) { action = 'APOSTAR (98% GTO)'; sizing = `${Math.round(pot * 0.65)} fichas (65% Pot)`; color = 'emerald'; }
                    else if (equity >= 38) { action = 'APUESTA SEMI-BLUFF'; sizing = `${Math.round(pot * 0.35)} fichas (35% Pot)`; color = 'emerald'; }
                } else {
                    if (equity >= potOdds + 4) { action = 'SUBIR / RAISE'; sizing = `Subir a ${Math.round(callAmount * 2.5)} fichas`; color = 'emerald'; }
                    else if (equity >= potOdds - 3) { action = 'IGUALAR (CALL)'; sizing = `Pagar ${callAmount} fichas`; color = 'blue'; }
                    else { action = 'ABANDONAR (FOLD)'; sizing = `Ahorrar ${callAmount} fichas`; color = 'red'; }
                }
                return { action, sizing, color, potOdds, mdf };
            }, [holeCards, boardCards, pot, callAmount, equity]);

            const startCameraStream = async () => {
                if (!apiKey) {
                    alert("Por favor, guarda tu API Key primero.");
                    return;
                }
                try {
                    const constraints = { video: { facingMode: 'environment', width: { ideal: 1280 }, height: { ideal: 720 } } };
                    const stream = await navigator.mediaDevices.getUserMedia(constraints);
                    if (videoRef.current) {
                        videoRef.current.srcObject = stream;
                        await videoRef.current.play();
                    }
                    setIsStreaming(true);
                    setStreamStatus('Streaming Activo');
                    runContinuousVisionLoop();
                } catch (err) {
                    setStreamStatus('Error de cámara');
                    setDebugLog('Error getUserMedia: ' + err.message);
                }
            };

            const stopCameraStream = () => {
                if (videoRef.current && videoRef.current.srcObject) {
                    videoRef.current.srcObject.getTracks().forEach(t => t.stop());
                    videoRef.current.srcObject = null;
                }
                if (streamTimerRef.current) clearInterval(streamTimerRef.current);
                setIsStreaming(false);
                setStreamStatus('Inactivo');
            };

            const runContinuousVisionLoop = () => {
                if (streamTimerRef.current) clearInterval(streamTimerRef.current);

                streamTimerRef.current = setInterval(async () => {
                    if (!videoRef.current || !canvasRef.current || !apiKey) return;
                    const video = videoRef.current;
                    const canvas = canvasRef.current;
                    canvas.width = video.videoWidth || 640;
                    canvas.height = video.videoHeight || 480;
                    const ctx = canvas.getContext('2d');
                    ctx.drawImage(video, 0, 0, canvas.width, canvas.height);

                    const base64Data = canvas.toDataURL('image/jpeg', 0.6).split(',')[1];
                    if (!base64Data) return;

                    // URL ACTUALIZADA CON GEMINI-1.5-FLASH
                    const apiUrl = `https://generativelanguage.googleapis.com/v1beta/models/gemini-1.5-flash:generateContent?key=${apiKey}`;

                    const prompt = `Analiza esta mesa de póker en tiempo real. Responde ÚNICAMENTE con un objeto JSON válido que contenga exactamente estas claves:
                    - "holeCards": array de 2 strings con formato de carta (ej: ["Ah", "Kd"]) o null si no se ven claramente.
                    - "boardCards": array de hasta 5 strings con formato de carta (ej: ["10s", "Jd", "2c"]).
                    - "pot": número entero con el bote actual en fichas.
                    - "callAmount": número entero con la apuesta a igualar.`;

                    try {
                        setDebugLog('Enviando fotograma a Gemini...');
                        const res = await fetch(apiUrl, {
                            method: 'POST',
                            headers: { 'Content-Type': 'application/json' },
                            body: JSON.stringify({
                                contents: [{
                                    role: 'user',
                                    parts: [
                                        { text: prompt },
                                        { inlineData: { mimeType: 'image/jpeg', data: base64Data } }
                                    ]
                                }],
                                generationConfig: { responseMimeType: 'application/json' }
                            })
                        });

                        const json = await res.json();
                        if (json.error) {
                            setDebugLog('Error API: ' + json.error.message);
                            return;
                        }

                        const rawText = json?.candidates?.[0]?.content?.parts?.[0]?.text;
                        if (!rawText) return;

                        const parsed = JSON.parse(rawText);
                        setDebugLog('¡IA OK! Bote: ' + parsed.pot);

                        if (parsed.holeCards && Array.isArray(parsed.holeCards) && parsed.holeCards.length >= 2) {
                            const parseCard = (str) => {
                                if (!str || typeof str !== 'string' || str.length < 2) return null;
                                const r = RANKS.find(x => x.label.toUpperCase() === str.slice(0, -1).toUpperCase());
                                const s = SUITS.find(x => x.id === str.slice(-1).toLowerCase());
                                return r && s ? { rank: r.value, suit: s.id, label: r.label, symbol: s.symbol } : null;
                            };
                            const h0 = parseCard(parsed.holeCards[0]);
                            const h1 = parseCard(parsed.holeCards[1]);
                            if (h0 && h1) setHoleCards([h0, h1]);
                        }

                        if (parsed.boardCards && Array.isArray(parsed.boardCards)) {
                            const parseCard = (str) => {
                                if (!str || typeof str !== 'string' || str.length < 2) return null;
                                const r = RANKS.find(x => x.label.toUpperCase() === str.slice(0, -1).toUpperCase());
                                const s = SUITS.find(x => x.id === str.slice(-1).toLowerCase());
                                return r && s ? { rank: r.value, suit: s.id, label: r.label, symbol: s.symbol } : null;
                            };
                            const b = [null, null, null, null, null];
                            parsed.boardCards.forEach((c, i) => { if (i < 5) b[i] = parseCard(c); });
                            setBoardCards(b);
                        }

                        if (parsed.pot !== undefined) setPot(Number(parsed.pot));
                        if (parsed.callAmount !== undefined) setCallAmount(Number(parsed.callAmount));

                    } catch (e) {
                        setDebugLog('Excepción de red: ' + e.message);
                    }
                }, 3000);
            };

            useEffect(() => {
                return () => { if (streamTimerRef.current) clearInterval(streamTimerRef.current); };
            }, []);

            const actionColors = {
                emerald: 'bg-emerald-500 text-slate-950 border-emerald-400',
                blue: 'bg-blue-600 text-white border-blue-500',
                amber: 'bg-amber-500 text-slate-950 border-amber-400',
                red: 'bg-rose-600 text-white border-rose-500',
                slate: 'bg-slate-900 text-slate-300 border-slate-800'
            }[decision.color];

            return (
                <div className="min-h-screen bg-slate-950 text-slate-100 p-4 max-w-xl mx-auto flex flex-col gap-4 font-sans select-none">
                    
                    {/* FORMULARIO API KEY */}
                    <form onSubmit={handleSaveKey} className="bg-slate-900 border border-slate-800 p-3.5 rounded-2xl flex flex-col gap-2 shadow-md">
                        <div className="flex justify-between items-center">
                            <label className="text-xs font-bold text-slate-300">Google Gemini API Key:</label>
                            {keySaved && <span className="text-[10px] text-emerald-400 font-bold">✓ Guardada</span>}
                        </div>
                        <div className="flex gap-2">
                            <input 
                                type="password" 
                                placeholder="Pega tu clave aquí (ej: AIzaSy...)" 
                                value={apiKeyInput} 
                                onChange={(e) => setApiKeyInput(e.target.value)}
                                className="bg-slate-950 border border-slate-800 rounded-xl px-3 py-2 text-xs text-white focus:outline-none focus:border-emerald-500 flex-1"
                            />
                            <button 
                                type="submit" 
                                className="bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-xs px-4 py-2 rounded-xl transition-all active:scale-95 shadow-md cursor-pointer"
                            >
                                Guardar Clave
                            </button>
                        </div>
                    </form>

                    <header className="flex items-center justify-between bg-slate-900 border border-slate-800 p-4 rounded-2xl shadow-lg">
                        <div className="flex items-center gap-3">
                            <div className="w-10 h-10 rounded-xl bg-emerald-500 flex items-center justify-center font-black text-slate-950 text-lg">♠</div>
                            <div>
                                <h1 className="font-extrabold text-base text-white">PokerVision <span className="text-emerald-400">Stream</span></h1>
                                <p className="text-xs text-slate-400">Asistente en Tiempo Real</p>
                            </div>
                        </div>
                        <div className="flex flex-col items-end">
                            <span className="text-[10px] text-emerald-400 font-semibold">{streamStatus}</span>
                            <span className="text-[9px] text-slate-400 max-w-[160px] truncate">Debug: {debugLog}</span>
                        </div>
                    </header>

                    {/* VISOR DE CÁMARA */}
                    <div className="relative bg-slate-900 border border-slate-800 rounded-2xl overflow-hidden shadow-2xl">
                        <video ref={videoRef} playsInline muted autoPlay className={`w-full h-48 object-cover ${isStreaming ? 'block' : 'hidden'}`} />
                        <canvas ref={canvasRef} className="hidden" />

                        {!isStreaming && (
                            <div className="h-48 flex flex-col items-center justify-center p-6 text-center bg-slate-950/60">
                                <p className="text-xs font-medium text-slate-300 mb-2">Guarda tu API Key y pulsa el botón inferior para activar la cámara</p>
                            </div>
                        )}

                        <div className="absolute bottom-3 right-3 left-3 flex gap-2">
                            {!isStreaming ? (
                                <button onClick={startCameraStream} type="button" className="w-full bg-emerald-500 hover:bg-emerald-400 text-slate-950 font-bold text-sm py-2.5 px-4 rounded-xl shadow-lg active:scale-95 cursor-pointer">
                                    Iniciar Streaming de Cámara
                                </button>
                            ) : (
                                <button onClick={stopCameraStream} type="button" className="w-full bg-rose-600 hover:bg-rose-500 text-white font-bold text-sm py-2.5 px-4 rounded-xl shadow-lg active:scale-95 cursor-pointer">
                                    Pausar Streaming
                                </button>
                            )}
                        </div>
                    </div>

                    {/* HUD GTO EN VIVO */}
                    <div className={`border-
